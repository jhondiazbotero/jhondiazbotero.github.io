<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Imagen para compartir (1200x630)</title>
<style>
  @font-face { font-family: "Red Hat Display"; src: url("../assets/fonts/red-hat-display-var.woff2") format("woff2"); font-weight: 500 800; }
  @font-face { font-family: "Manrope"; src: url("../assets/fonts/manrope-var.woff2") format("woff2"); font-weight: 400 700; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; background: #0b1220; }
  .lienzo {
    position: relative; width: 1200px; height: 630px; overflow: hidden;
    background: linear-gradient(135deg, #0b1220, #111c33);
    font-family: "Manrope", "Segoe UI", sans-serif; color: #cbd5e1;
  }
  .rejilla {
    position: absolute; inset: 0;
    background-image: linear-gradient(#1e293b 1px, transparent 1px), linear-gradient(90deg, #1e293b 1px, transparent 1px);
    background-size: 40px 40px; opacity: .55;
  }
  .barra { position: absolute; left: 80px; top: 128px; width: 8px; height: 300px; border-radius: 4px; background: linear-gradient(180deg, #38bdf8, #818cf8); }
  .texto { position: absolute; left: 124px; top: 120px; width: 680px; }
  h1 { font-family: "Red Hat Display", "Segoe UI", sans-serif; font-weight: 800; font-size: 92px; line-height: 1; letter-spacing: -0.035em; color: #f8fafc; }
  .cargo { margin-top: 26px; font-family: "Red Hat Display", sans-serif; font-weight: 500; font-size: 29px; white-space: nowrap; line-height: 1.3; color: #cbd5e1; }
  .stack { margin-top: 28px; font-family: Consolas, "Liberation Mono", monospace; font-size: 20px; white-space: nowrap; line-height: 1.5; color: #38bdf8; }
  .simbolo { position: absolute; right: 90px; top: 175px; width: 300px; }
  .dir { position: absolute; left: 124px; bottom: 54px; font-family: Consolas, "Liberation Mono", monospace; font-size: 22px; color: #94a3b8; }
  .lugar { position: absolute; right: 90px; bottom: 54px; font-family: Consolas, "Liberation Mono", monospace; font-size: 22px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="lienzo">
    <div class="rejilla"></div>
    <div class="barra"></div>
    <div class="texto">
      <h1>Jhon Díaz Botero</h1>
      <p class="cargo">Desarrollador de software senior · Líder técnico</p>
      <p class="stack">.NET / C# · PHP / Laravel · Vue · Oracle · SQL Server</p>
    </div>
    <svg class="simbolo" viewBox="0 0 156 90" fill="none" stroke="url(#a)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/></linearGradient></defs>
      <path d="M40 10 L10 45 L40 80"/><path d="M116 10 L146 45 L116 80"/><path d="M90 4 L66 86"/>
    </svg>
    <p class="dir">jhondiazbotero.github.io</p>
    <p class="lugar">Medellín, Colombia</p>
  </div>
</body>
</html>
